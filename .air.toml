#:schema https://json.schemastore.org/any.json

# Used by: make run-<service> / script/run-service.sh
# Air is started from the repo root (go.work); build.cmd / build.bin are set per service by the runner.
env_files = []
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./tmp/manager"
  cmd = "go build -o ./tmp/manager ./services/manager/cmd"
  delay = 1000
  entrypoint = ["./tmp/manager"]
  exclude_dir = ["tmp", "bin", "data", "backups", "frontend", "vendor", "testdata", "dist", "node_modules"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  ignore_dangerous_root_dir = false
  # Only watch Go source trees (avoids walking frontend/node_modules).
  include_dir = ["services", "shared"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  include_file = []
  kill_delay = "0s"
  log = "build-errors.log"
  # Poll instead of inotify — avoids "too many open files" on container/FUSE workspaces.
  poll = true
  poll_interval = 500
  post_cmd = []
  pre_cmd = []
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = false

[misc]
  clean_on_exit = false

[proxy]
  app_port = 0
  app_start_timeout = 0
  enabled = false
  proxy_port = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
